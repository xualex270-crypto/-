<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不说</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
        body {
            min-height:100vh;
            background: radial-gradient(ellipse at 50% 45%, #5a4a38 0%, #3a2a18 38%, #1e1008 72%, #0a0400 100%);
            display:flex; align-items:center; justify-content:center;
            font-family:"SimSun","KaiTi","STKaiti","PingFang SC","Microsoft YaHei",serif;
        }
        .gate {
            text-align:center; padding:20px;
        }
        .gate h2 {
            font-size:1.1rem; font-weight:normal; letter-spacing:.24em;
            color:rgba(210,190,160,0.55); margin-bottom:36px;
        }
        .input-wrap {
            display:inline-flex; align-items:center; gap:0;
            border-bottom:1px solid rgba(210,190,160,0.25);
            padding-bottom:6px; transition:border-color .4s;
        }
        .input-wrap:focus-within { border-color:rgba(210,190,160,0.55); }
        .input-wrap input {
            background:none; border:none; color:rgba(220,200,170,0.85);
            font-size:1rem; letter-spacing:.24em; text-align:center;
            width:160px; font-family:inherit; padding:4px 0;
        }
        .input-wrap input::placeholder { color:rgba(180,160,130,0.25); letter-spacing:.16em; }
        .input-wrap button {
            background:none; border:none; color:rgba(210,190,160,0.4);
            font-size:1.1rem; cursor:pointer; padding:4px 8px;
            transition:color .3s; font-family:inherit;
        }
        .input-wrap button:hover { color:rgba(220,200,170,0.75); }
        .hint {
            font-size:.7rem; color:rgba(180,160,130,0.3);
            margin-top:20px; letter-spacing:.08em;
            min-height:20px; transition:color .3s;
        }
        .hint.error { color:rgba(200,120,100,0.55); }
    </style>
</head>
<body>
<div class="gate">
    <h2>请输入密码</h2>
    <div class="input-wrap">
        <input type="password" id="pw" placeholder="····" maxlength="16" autofocus>
        <button id="btnGo">→</button>
    </div>
    <div class="hint" id="hint"></div>
</div>
<script>
var PASSWORD = 'getlost';
var input = document.getElementById('pw');
var hint = document.getElementById('hint');

function tryUnlock() {
    if (input.value === PASSWORD) {
        hint.textContent = '';
        hint.classList.remove('error');
        document.body.style.transition = 'opacity .5s';
        document.body.style.opacity = '0';
        setTimeout(function(){ window.location.href = 'main.html'; }, 500);
    } else if (input.value.length > 0) {
        hint.textContent = '没什么好给你看的';
        hint.classList.add('error');
        input.value = '';
        input.focus();
    }
}

document.getElementById('btnGo').addEventListener('click', tryUnlock);
input.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryUnlock(); });
</script>
</body>
</html>
