<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立秋 — 购买</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --bg: #f7f4ef; --text: #3a3028; --muted: #8a7a68; --accent: #b48648; --accent-deep: #8a5a30; --card: #fffdf9; --border: #e5ddd0; --shadow: rgba(120,80,40,0.06); }
        body { font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.8; letter-spacing: .04em; opacity: 0; }
        body.ready { animation: sweepIn .8s ease-out forwards; }
        @keyframes sweepIn { 0% { filter: blur(18px); opacity: 1; } 100% { filter: blur(0); opacity: 1; } }
        body.fading-out { animation: blurOut .5s ease-in forwards; }
        @keyframes blurOut { 0% { filter: blur(0); opacity: 1; } 100% { filter: blur(18px); opacity: 1; } }
        #leaf-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .leaf-particle { position: absolute; pointer-events: none; background: #c8a060; border-radius: 0 70% 0 70%; opacity: .10; will-change: transform; }
        .main { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; padding: 0 28px 120px; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; padding: 24px 0 8px; font-size: .85rem; color: var(--muted); cursor: pointer; user-select: none; letter-spacing: .06em; transition: color .3s; text-decoration: none; }
        .back-link:hover { color: var(--accent-deep); }
        .back-arrow { font-size: 1.1rem; }
        .hero { display: flex; flex-direction: column; align-items: center; padding: 48px 0 40px; }
        .cover { width: 200px; height: 280px; border-radius: 3px 12px 12px 3px; box-shadow: 0 20px 50px rgba(80,50,20,.16),0 4px 12px rgba(80,50,20,.08),1px 0 0 rgba(0,0,0,.04); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-left: 4px solid rgba(0,0,0,.15); }
        .cover::after { content: ""; position: absolute; left: 10px; top: 12px; bottom: 12px; width: 1px; background: rgba(0,0,0,.04); }
        .cover-leaf { position: absolute; width: 26px; height: 26px; background: #b48648; border-radius: 0 70% 0 70%; opacity: .22; top: 34px; right: 22px; transform: rotate(35deg); }
        .cover-title { font-family: "SimSun","KaiTi","STKaiti",serif; font-size: 2rem; letter-spacing: .32em; color: #4a3830; font-weight: bold; margin-right: -.32em; }
        .cover-author { font-family: "SimSun","KaiTi","STKaiti",serif; font-size: .78rem; color: #9a8a70; margin-top: 14px; letter-spacing: .14em; }
        .book-info { text-align: center; padding: 0 0 36px; }
        .book-name { font-family: "SimSun","KaiTi","STKaiti",serif; font-size: 1.5rem; letter-spacing: .18em; font-weight: bold; }
        .book-author { font-size: .88rem; color: var(--muted); margin-top: 6px; letter-spacing: .1em; }
        .book-tagline { font-size: .82rem; color: #b0a090; margin-top: 10px; font-style: italic; letter-spacing: .06em; }
        .ornament { width: 60px; height: 1px; background: #d0c8b8; margin: 0 auto 36px; }
        .card { background: var(--card); border-radius: 12px; padding: 28px 22px; margin-bottom: 16px; box-shadow: 0 2px 12px var(--shadow); border: 1px solid var(--border); }
        .card-label { font-size: .72rem; color: #b0a090; letter-spacing: .12em; margin-bottom: 12px; }
        .card p { font-size: .88rem; line-height: 2.2; color: #5a4a3a; text-align: justify; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .info-item { background: var(--card); border-radius: 10px; padding: 18px 16px; text-align: center; border: 1px solid var(--border); box-shadow: 0 1px 8px var(--shadow); }
        .info-item .info-value { font-family: "SimSun","KaiTi","STKaiti",serif; font-size: 1.05rem; color: var(--text); letter-spacing: .06em; }
        .info-item .info-label { font-size: .7rem; color: #b0a090; margin-top: 4px; letter-spacing: .08em; }
        .price-card { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 24px 0 8px; }
        .price-current { font-family: "Georgia","SimSun",serif; font-size: 2.4rem; color: #6a4020; letter-spacing: .04em; }
        .price-current .yen { font-size: 1.2rem; }
        .price-original { font-size: .9rem; color: #c0b0a0; text-decoration: line-through; }
        .buy-section { text-align: center; padding: 20px 0 40px; }
        .btn-buy { display: inline-block; padding: 14px 60px; font-size: 1rem; letter-spacing: .14em; font-family: "SimSun","KaiTi","STKaiti",serif; color: #fff; background: linear-gradient(135deg,#b48648,#9a6a38); border: none; border-radius: 28px; cursor: pointer; box-shadow: 0 4px 16px rgba(140,100,50,.25); transition: all .4s; user-select: none; }
        .btn-buy:hover { box-shadow: 0 6px 24px rgba(140,100,50,.38); transform: translateY(-1px); letter-spacing: .2em; }
        .btn-buy:active { transform: scale(.97); box-shadow: 0 2px 8px rgba(140,100,50,.2); }
        .buy-note { font-size: .72rem; color: #c0b0a0; margin-top: 14px; letter-spacing: .06em; }
        .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(30,20,10,.55); display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
        .modal-overlay.show { display: flex; }
        .modal-dialog { width: 300px; background: #fffdf9; border-radius: 16px; padding: 32px 24px 24px; text-align: center; box-shadow: 0 20px 50px rgba(40,20,0,.25); animation: modalIn .35s ease-out; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-dialog h3 { font-family: "SimSun","KaiTi","STKaiti",serif; font-size: 1.2rem; letter-spacing: .1em; margin-bottom: 8px; }
        .modal-dialog .modal-price { font-size: 1.6rem; color: #6a4020; margin-bottom: 20px; font-family: "Georgia",serif; }
        .modal-qty { display: inline-flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .modal-qty button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #d0c8b8; background: #fffdf9; font-size: 1.1rem; color: #8a6a40; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; user-select: none; }
        .modal-qty button:active { background: #f5efe4; }
        .modal-qty button.disabled { color: #d0c8b8; border-color: #e8e0d4; pointer-events: none; }
        .modal-qty .qty-num { font-size: 1.1rem; min-width: 24px; font-weight: 600; }
        .btn-confirm { width: 100%; padding: 13px 0; border-radius: 24px; border: none; background: linear-gradient(135deg,#b48648,#9a6a38); color: #fff; font-size: .95rem; letter-spacing: .1em; font-family: "SimSun","KaiTi","STKaiti",serif; cursor: pointer; transition: all .3s; }
        .btn-confirm:active { opacity: .85; transform: scale(.97); }
        .btn-cancel { margin-top: 12px; font-size: .8rem; color: #b0a090; cursor: pointer; user-select: none; letter-spacing: .06em; }
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(30,20,10,.82); color: #f0e8d8; padding: 14px 28px; border-radius: 8px; font-size: .9rem; z-index: 300; pointer-events: none; opacity: 0; transition: opacity .4s; letter-spacing: .06em; }
        .toast.show { opacity: 1; }
        @media (max-width: 380px) { .main { padding: 0 20px 100px; } .cover { width: 170px; height: 238px; } .hero { padding: 36px 0 30px; } }
    </style>
</head>
<body>
    <div id="leaf-layer"></div>
    <div class="main">
        <a class="back-link" href="series.html"><span class="back-arrow">←</span> 返回</a>
        <div class="hero">
            <div class="cover" style="background:linear-gradient(155deg,#E8D0B8,#D4B898,#C0A078,#CCB088,#DCC4A0);">
                <div class="cover-leaf"></div>
                <span class="cover-title">立秋</span>
                <span class="cover-author">半朵忍冬</span>
            </div>
        </div>
        <div class="book-info">
            <div class="book-name">立秋</div>
            <div class="book-author">半朵忍冬 · 著</div>
            <div class="book-tagline">一叶知秋，心事未凉。</div>
        </div>
        <div class="ornament"></div>
        <div class="card">
            <div class="card-label">内容简介</div>
            <p>关于初秋的故事。暑气未消，梧桐已落下第一片黄叶。新学期的铃声响起，教室里的座位重新排列，有人被分到了窗边，有人坐到了后排。那些夏天没能说出口的话，在微凉的秋风里，更不知从何说起。而梧桐叶还在一叶一叶地落。</p>
        </div>
        <div class="info-grid">
            <div class="info-item"><div class="info-value">230页</div><div class="info-label">平装</div></div>
            <div class="info-item"><div class="info-value">2026</div><div class="info-label">出版年份</div></div>
            <div class="info-item"><div class="info-value">不说文化</div><div class="info-label">出版社</div></div>
            <div class="info-item"><div class="info-value">包邮</div><div class="info-label">配送方式</div></div>
        </div>
        <div class="price-card">
            <span class="price-original">¥68.00</span>
            <span class="price-current"><span class="yen">¥</span>39.80</span>
        </div>
        <div class="buy-section">
            <button class="btn-buy" id="btnBuy">购 买</button>
            <div class="buy-note">正版保障 · 7天无理由退换 · 48小时发货</div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-dialog">
            <h3>《立秋》</h3>
            <div class="modal-price">¥39.80</div>
            <div class="modal-qty">
                <button class="disabled" id="modalMinus">−</button>
                <span class="qty-num" id="modalQty">1</span>
                <button id="modalPlus">+</button>
            </div>
            <button class="btn-confirm" id="modalConfirm">确认购买</button>
            <div class="btn-cancel" id="modalCancel">再想想</div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
    (function(){
        requestAnimationFrame(function(){requestAnimationFrame(function(){document.body.classList.add('ready');});});
        var backLink=document.querySelector('.back-link');
        if(backLink){backLink.addEventListener('click',function(e){e.preventDefault();var h=this.getAttribute('href');document.body.classList.add('fading-out');setTimeout(function(){window.location.href=h;},500);});}
        var leafLayer=document.getElementById('leaf-layer'),leafCount=0,LEAF_MAX=14;
        function createLeaf(){if(leafCount>=LEAF_MAX)return;var l=document.createElement('div');l.className='leaf-particle';var s=14+Math.random()*16;l.style.width=s+'px';l.style.height=s+'px';l.style.left=Math.random()*100+'%';l.style.top='-30px';leafLayer.appendChild(l);leafCount++;var d=9000+Math.random()*8000,r=Math.random()*540,st=null;function step(ts){if(!st)st=ts;var p=Math.min((ts-st)/d,1);l.style.transform='translateY('+(p*108)+'vh) rotate('+(r*p)+'deg)';if(p<1)requestAnimationFrame(step);else{l.remove();leafCount--;}}requestAnimationFrame(step);}
        setInterval(createLeaf,900);
        var qty=1,MIN=1,MAX=99;
        function uq(){document.getElementById('modalQty').textContent=qty;document.getElementById('modalMinus').classList.toggle('disabled',qty<=MIN);document.getElementById('modalPlus').classList.toggle('disabled',qty>=MAX);}
        function cq(d){var n=qty+d;if(n<MIN||n>MAX)return;qty=n;uq();}
        document.getElementById('modalMinus').addEventListener('click',function(){cq(-1);});document.getElementById('modalPlus').addEventListener('click',function(){cq(1);});
        var overlay=document.getElementById('modalOverlay');
        function om(){qty=1;uq();overlay.classList.add('show');}
        function cm(){overlay.classList.remove('show');}
        overlay.addEventListener('click',function(e){if(e.target===overlay)cm();});
        document.getElementById('modalCancel').addEventListener('click',cm);
        document.getElementById('modalConfirm').addEventListener('click',function(){cm();showToast('已下单，即将跳转支付……');});
        function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
        document.getElementById('btnBuy').addEventListener('click',om);
        uq();
    })();
    </script>
</body>
</html>
